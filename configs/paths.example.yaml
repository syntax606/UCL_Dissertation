# Copy this file to configs/paths.yaml and set the paths for your machine.
# configs/paths.yaml is git-ignored so no machine-specific path is committed.

# Directory of source audio: per-show subfolders containing <episode_id>.mp3
audio_dir: /path/to/podcast-audio

# Directory of word-level transcripts: per-show subfolders containing
# <episode_id>.json with segments[].words[].{word,start,end} (e.g. WhisperX output)
transcripts_dir: /path/to/podcast-transcripts

# Optional. Where src/31 writes frame-level sequences (several GB). Omit to use
# features_frames/ inside the repo, which is git-ignored. Set this to an external
# disk if the main volume is tight.
# frames_dir: /Volumes/YourDrive/pragmatic_contrast_frames
